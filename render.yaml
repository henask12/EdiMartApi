# Render Blueprint — EdiMart API
# Dashboard override: Root Directory must be empty (repo root), NOT "src".
# Start Command must be npm start (never yarn).

databases:
  - name: edimart-db
    plan: free

services:
  - type: web
    name: edimart-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: edimart-db
          property: connectionString
      - key: WEB_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SETUP_ENABLED
        value: "0"
      - key: SETUP_SECRET
        generateValue: true
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: SESSION_TTL_HOURS
        value: "8"
      - key: STORAGE_DRIVER
        value: local
      - key: PUBLIC_API_URL
        sync: false
      - key: UPLOAD_DIR
        value: ./uploads
